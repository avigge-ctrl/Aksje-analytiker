name: Aksjeskanner
on:
  schedule:
    - cron: "30 21 * * 1-5"   # 21:30 UTC = etter USA-børsene stenger (22:30 vintertid / 23:30 sommertid i Norge)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas numpy lxml
      - run: python scan.py
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: avigge@gmail.com
      - name: Lagre state
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "Oppdater state" && git push)
